name: Build & Release Antigravity Debian Packages

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force build even if versions are already up-to-date"
        required: false
        default: false
        type: boolean
      product:
        description: "Product to package"
        required: true
        default: "all"
        type: choice
        options:
          - "all"
          - "antigravity"
          - "antigravity-ide"
          - "antigravity-cli"
      arch:
        description: "Target architecture"
        required: true
        default: "both"
        type: choice
        options:
          - "both"
          - "amd64"
          - "arm64"
      publish_release:
        description: "Publish as GitHub Release"
        required: true
        default: true
        type: boolean

  schedule:
    # Daily auto-check at 02:00 UTC
    - cron: "0 2 * * *"

permissions:
  contents: write
  packages: write

jobs:
  resolve:
    name: Check Updates & Resolve Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.check.outputs.matrix }}
      hub_version: ${{ steps.check.outputs.hub_version }}
      ide_version: ${{ steps.check.outputs.ide_version }}
      cli_version: ${{ steps.check.outputs.cli_version }}
      should_build: ${{ steps.check.outputs.should_build }}
      updated: ${{ steps.check.outputs.updated }}
      publish_release: ${{ steps.check.outputs.publish_release }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check for Upstream Updates
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FORCE="${{ github.event.inputs.force_build == 'true' }}"
          PROD="${{ github.event.inputs.product || 'all' }}"
          ARCH="${{ github.event.inputs.arch || 'both' }}"
          PUBLISH="${{ github.event.inputs.publish_release != 'false' }}"

          EXTRA_ARGS=""
          if [ "$FORCE" = "true" ]; then
            EXTRA_ARGS="--force"
          fi

          echo "[*] Checking for latest versions and updates..."
          MATRIX_JSON=$(python3 build_deb.py --check-update $EXTRA_ARGS \
            --product "$PROD" \
            --arch "$ARCH" \
            --version-file versions.json \
            --matrix-json)

          echo "Matrix Output: $MATRIX_JSON"

          UPDATED=$(echo "$MATRIX_JSON" | jq -r .updated)
          SHOULD_BUILD=$(echo "$MATRIX_JSON" | jq -r .should_build)
          HUB_VER=$(echo "$MATRIX_JSON" | jq -r .hub_version)
          IDE_VER=$(echo "$MATRIX_JSON" | jq -r .ide_version)
          CLI_VER=$(echo "$MATRIX_JSON" | jq -r .cli_version)
          MATRIX=$(echo "$MATRIX_JSON" | jq -c .matrix)

          echo "updated=$UPDATED" >> $GITHUB_OUTPUT
          echo "should_build=$SHOULD_BUILD" >> $GITHUB_OUTPUT
          echo "hub_version=$HUB_VER" >> $GITHUB_OUTPUT
          echo "ide_version=$IDE_VER" >> $GITHUB_OUTPUT
          echo "cli_version=$CLI_VER" >> $GITHUB_OUTPUT
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "publish_release=$PUBLISH" >> $GITHUB_OUTPUT

          if [ "$SHOULD_BUILD" != "true" ]; then
            echo "::notice ::No updates found (Antigravity 2.0: $HUB_VER, IDE: $IDE_VER, CLI: $CLI_VER). Skipping download and packaging."
          else
            echo "::notice ::Updates detected! Building targets: $(echo "$MATRIX_JSON" | jq -c .updated_products)"
          fi

  build:
    name: Build ${{ matrix.product }} (${{ matrix.arch }})
    needs: resolve
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.resolve.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Debian Package
        run: |
          mkdir -p dist
          python3 build_deb.py \
            --product "${{ matrix.product }}" \
            --arch "${{ matrix.arch }}" \
            --force \
            --out-dir dist

      - name: Upload Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.product }}-${{ matrix.version }}-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish Release & Update Versions
    needs: [resolve, build]
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download all deb packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate Checksums & Release Notes
        run: |
          cd dist
          sha256sum *.deb > SHA256SUMS.txt
          echo "=== Checksums ==="
          cat SHA256SUMS.txt
          cd ..

          python3 build_deb.py --generate-release-notes release_notes.md

      - name: Upload All Packages Artifact
        uses: actions/upload-artifact@v4
        with:
          name: antigravity-deb-packages-all
          path: dist/*
          retention-days: 30

      - name: Publish GitHub Release
        if: needs.resolve.outputs.publish_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HUB_VER="${{ needs.resolve.outputs.hub_version }}"
          IDE_VER="${{ needs.resolve.outputs.ide_version }}"
          CLI_VER="${{ needs.resolve.outputs.cli_version }}"
          TAG="v${HUB_VER}-${IDE_VER}"
          TITLE="Google Antigravity 2.0 (v${HUB_VER}), IDE (v${IDE_VER}) & CLI (v${CLI_VER})"

          echo "[*] Publishing release $TAG..."
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "[*] Updating existing release $TAG..."
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file release_notes.md
          else
            echo "[*] Creating new release $TAG..."
            gh release create "$TAG" dist/* \
              --title "$TITLE" \
              --notes-file release_notes.md
          fi

      - name: Commit and Push Updated versions.json
        run: |
          HUB_VER="${{ needs.resolve.outputs.hub_version }}"
          IDE_VER="${{ needs.resolve.outputs.ide_version }}"
          CLI_VER="${{ needs.resolve.outputs.cli_version }}"

          echo "{\"antigravity\": \"$HUB_VER\", \"antigravity-ide\": \"$IDE_VER\", \"antigravity-cli\": \"$CLI_VER\"}" > versions.json

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add versions.json
          if git diff --staged --quiet; then
            echo "[i] versions.json unchanged. Nothing to commit."
          else
            git commit -m "chore: bump tracked versions to Antigravity $HUB_VER, IDE $IDE_VER, CLI $CLI_VER [skip ci]"
            git push
          fi
